name: n8n-local-dev

x-chatwoot-base: &chatwoot-base
  image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
  restart: unless-stopped
  volumes:
    - chatwoot_storage_data:/app/storage

x-chatwoot-environment: &chatwoot-environment
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
  POSTGRES_HOST: chatwoot-postgres
  POSTGRES_PORT: 5432
  POSTGRES_DATABASE: chatwoot
  POSTGRES_USERNAME: chatwoot
  ACTIVE_STORAGE_SERVICE: local
  ENABLE_ACCOUNT_SIGNUP: ${CHATWOOT_ENABLE_ACCOUNT_SIGNUP:-true}
  SAFE_FETCH_ALLOW_PRIVATE_NETWORK: ${CHATWOOT_SAFE_FETCH_ALLOW_PRIVATE_NETWORK:-true}
  FORCE_SSL: "false"
  RAILS_LOG_TO_STDOUT: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL}
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_RUNNERS_MODE: internal
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    env_file:
      - .env.chatwoot-n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - ./assets:/files/assets
    depends_on:
      postgres:
        condition: service_healthy

  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env.chatwoot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data

  chatwoot-redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env.chatwoot
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - chatwoot_redis_data:/data

  chatwoot-rails:
    <<: *chatwoot-base
    environment:
      <<: *chatwoot-environment
    env_file:
      - .env.chatwoot
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:${CHATWOOT_PORT:-3000}:3000"
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy

  chatwoot-sidekiq:
    <<: *chatwoot-base
    environment:
      <<: *chatwoot-environment
    env_file:
      - .env.chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy

volumes:
  n8n_data:
  postgres_data:
  chatwoot_storage_data:
  chatwoot_postgres_data:
  chatwoot_redis_data:
